<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>EchoVerse — Centro de Misiones</title>

    <link rel="stylesheet" href="styles/missions.css">
</head>

<body>

    <!-- Fondo dinámico -->
    <div class="mission-bg"></div>

    <header class="mission-header">
        <h1>C E N T R O  D E  M I S I O N E S</h1>
        <p class="subtitle">“Cada acción deja una huella en el EchoVerse.”</p>
    </header>

    <!-- GRID DE MISIONES -->
    <section class="mission-grid">

        <article class="mission-card">
            <h2>🎧 Stream Challenge</h2>
            <p>Reproduce tu canción favorita 3 veces hoy.</p>
            <button class="mission-btn" data-id="stream">Ver progreso</button>
        </article>

        <article class="mission-card">
            <h2>💜 Mensaje ARMY</h2>
            <p>Envía un mensaje positivo a la comunidad.</p>
            <button class="mission-btn" data-id="message">Enviar mensaje</button>
        </article>

        <article class="mission-card">
            <h2>📸 Memory Drop</h2>
            <p>Sube un recuerdo especial de BTS.</p>
            <button class="mission-btn" data-id="memory">Subir recuerdo</button>
        </article>

    </section>

    <button class="back-btn" onclick="window.location.href='../index.html'">
        ⟵ Regresar
    </button>

    <script src="scripts/missions.js"></script>
</body>
</html>
