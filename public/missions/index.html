<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>EchoVerse — Centro de Misiones</title>

    <link rel="stylesheet" href="../assets/css/missions.css">
</head>

<body>

    <!-- Fondo dinámico -->
    <div class="mission-bg"></div>

    <header class="mission-header">
        <h1>C E N T R O  D E  M I S I O N E S</h1>
        <p class="subtitle">“Cada acción deja una huella en el EchoVerse.”</p>
        <p id="missionProgress" class="subtitle mission-progress"></p>
            <div id="missionLevelBar" class="mission-level-bar" aria-label="Progreso al siguiente nivel">
                <div id="missionLevelBarFill" class="mission-level-bar-fill"></div>
            </div>
    </header>

    <!-- GRID DE MISIONES -->
    <section class="mission-grid">

        <article class="mission-card">
            <h2>🎛️ Activa Army Mode</h2>
            <p>Activa el modo Army en el portal (toggle de tema).</p>
            <button class="mission-btn" data-id="army">Ir al portal</button>
        </article>

        <article class="mission-card">
            <h2>💜 Mensaje ARMY</h2>
            <p>Envía un mensaje positivo a la comunidad.</p>
            <button class="mission-btn" data-id="message">Enviar mensaje</button>
        </article>

        <article class="mission-card">
            <h2>📸 Entrega de recuerdos</h2>
            <p>Comparte un recuerdo especial de BTS.</p>
            <button class="mission-btn" data-id="memory">Subir recuerdo</button>
        </article>

    </section>

    <button class="back-btn" onclick="window.location.href='../index.html'">
        ⟵ Regresar
    </button>

    <script src="../assets/js/missions.js"></script>
</body>
</html>
