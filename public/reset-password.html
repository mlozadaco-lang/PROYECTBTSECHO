<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            text-align: center;
        }

        .form-container {
            background: #fff;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #7c6cff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .message {
            margin-top: 10px;
            color: red;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Cambia tu contraseña</h2>
        <form id="resetForm">
            <input type="password" id="newPassword" placeholder="Nueva contraseña" required>
            <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" required>
            <button type="submit">Restablecer Contraseña</button>
        </form>
        <div id="resetMessage" class="message"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.getElementById("resetForm");
            const messageDiv = document.getElementById("resetMessage");

            // Obtener el token de la URL
            const resetToken = new URLSearchParams(window.location.search).get('token');
            if (!resetToken) {
                messageDiv.textContent = "Token inválido.";
                return;
            }

            // Enviar los datos al backend para actualizar la contraseña
            form.addEventListener("submit", async function(e) {
                e.preventDefault();

                const password = document.getElementById("newPassword").value;
                const confirmPassword = document.getElementById("confirmPassword").value;

                // Validar que las contraseñas coincidan
                if (password !== confirmPassword) {
                    messageDiv.textContent = "Las contraseñas no coinciden.";
                    messageDiv.style.color = "red";
                    return;
                }

                // Enviar al backend
                try {
                    const response = await fetch('/api/reset-password.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            token: resetToken,
                            password: password
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        messageDiv.textContent = "Contraseña restablecida correctamente.";
                        messageDiv.style.color = "green";
                        setTimeout(() => {
                            window.location.href = "/index.html"; // Redirige al inicio
                        }, 3000);
                    } else {
                        messageDiv.textContent = data.message;
                        messageDiv.style.color = "red";
                    }
                } catch (error) {
                    messageDiv.textContent = "Error al intentar restablecer la contraseña. Intenta más tarde.";
                    messageDiv.style.color = "red";
                }
            });
        });
    </script>

</body>
</html>
